<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9F2"/><stop offset="1" stop-color="#F5EADC"/>
    </linearGradient>
    <linearGradient id="furC" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF6E8"/><stop offset="0.6" stop-color="#F6E4CB"/><stop offset="1" stop-color="#E7CFB0"/>
    </linearGradient>
    <radialGradient id="cheekC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A9A2" stop-opacity="0.75"/><stop offset="1" stop-color="#F5A9A2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scarfC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FD3E8"/><stop offset="1" stop-color="#4FBED6"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6FD3E8" stop-opacity="0.4"/><stop offset="1" stop-color="#6FD3E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="820" height="380" fill="url(#bgC)"/>
  <text x="28" y="40" font-size="19" font-weight="700" fill="#3B2C1E">方向 C · 围巾小兽「雪球」</text>
  <text x="28" y="63" font-size="13" fill="#6B5A48">圆滚滚毛球 + 长围巾 · 围巾颜色 = 状态 · 围巾飘动幅度 = 忙不忙</text>

  <!-- ===== 待机 idle ===== -->
  <g transform="translate(150 252)">
    <ellipse cx="0" cy="58" rx="58" ry="11" fill="#3B2C1E" opacity="0.08"/>
    <circle cx="0" cy="0" r="80" fill="url(#glowC)"/>
    <!-- 耳朵 -->
    <ellipse cx="-34" cy="-48" rx="15" ry="14" fill="#F6E4CB" stroke="#E2C9A8" stroke-width="1.4"/>
    <ellipse cx="34" cy="-48" rx="15" ry="14" fill="#F6E4CB" stroke="#E2C9A8" stroke-width="1.4"/>
    <!-- 身体 -->
    <ellipse cx="0" cy="2" rx="54" ry="50" fill="url(#furC)" stroke="#E2C9A8" stroke-width="1.5"/>
    <!-- 围巾 -->
    <path d="M-46 18 q 46 20 92 0 q -6 16 -46 18 q -40 -2 -46 -18 z" fill="url(#scarfC)"/>
    <path d="M40 26 q 26 14 22 44 q -4 -18 -18 -26 q 8 16 2 30 q -6 -22 -22 -28 z" fill="url(#scarfC)" opacity="0.95"/>
    <!-- 脸 -->
    <circle cx="-19" cy="-8" r="15" fill="url(#cheekC)"/>
    <circle cx="19" cy="-8" r="15" fill="url(#cheekC)"/>
    <path d="M-22 -16 q 7 -7 14 0" fill="none" stroke="#3B2C1E" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M8 -16 q 7 -7 14 0" fill="none" stroke="#3B2C1E" stroke-width="3.8" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="5.5" ry="4" fill="#C98A83"/>
    <path d="M0 4 v 6 M0 10 q -7 6 -13 1 M0 10 q 7 6 13 1" fill="none" stroke="#3B2C1E" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 小爪 -->
    <ellipse cx="-30" cy="42" rx="12" ry="8" fill="#F6E4CB" stroke="#E2C9A8" stroke-width="1.3"/>
    <ellipse cx="30" cy="42" rx="12" ry="8" fill="#F6E4CB" stroke="#E2C9A8" stroke-width="1.3"/>
  </g>
  <text x="150" y="352" font-size="13.5" text-anchor="middle" fill="#4A3B2C">待机 · 呼吸起伏 + 围巾轻摆</text>

  <!-- ===== 干活 working ===== -->
  <g transform="translate(410 252)">
    <ellipse cx="0" cy="58" rx="58" ry="11" fill="#3B2C1E" opacity="0.08"/>
    <circle cx="0" cy="0" r="80" fill="#FFC24B" opacity="0.18"/>
    <ellipse cx="-34" cy="-46" rx="15" ry="14" fill="#F6E4CB" stroke="#E2C9A8" stroke-width="1.4"/>
    <ellipse cx="34" cy="-46" rx="15" ry="14" fill="#F6E4CB" stroke="#E2C9A8" stroke-width="1.4"/>
    <ellipse cx="0" cy="2" rx="54" ry="50" fill="url(#furC)" stroke="#E2C9A8" stroke-width="1.5"/>
    <path d="M-46 18 q 46 20 92 0 q -6 16 -46 18 q -40 -2 -46 -18 z" fill="#FFC24B"/>
    <!-- 飘起来的围巾尾 -->
    <path d="M42 24 q 34 2 52 -22 q -18 8 -34 8 q 22 4 34 -12 q -24 12 -52 6 z" fill="#FFC24B" opacity="0.95"/>
    <circle cx="-20" cy="-6" r="15" fill="url(#cheekC)"/>
    <circle cx="20" cy="-6" r="15" fill="url(#cheekC)"/>
    <path d="M-22 -18 q 7 -6 14 0" fill="none" stroke="#3B2C1E" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M8 -18 q 7 -6 14 0" fill="none" stroke="#3B2C1E" stroke-width="3.8" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="5.5" ry="4" fill="#C98A83"/>
    <path d="M-9 12 q 9 8 18 0" fill="none" stroke="#3B2C1E" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="-32" cy="34" rx="11" ry="9" fill="#F6E4CB" stroke="#E2C9A8" stroke-width="1.3" transform="rotate(-18 -32 34)"/>
    <ellipse cx="32" cy="34" rx="11" ry="9" fill="#F6E4CB" stroke="#E2C9A8" stroke-width="1.3" transform="rotate(18 32 34)"/>
    <g stroke="#FFC24B" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M-70 -46 l -14 -10"/><path d="M-76 -22 l -16 -4"/>
    </g>
  </g>
  <text x="410" y="352" font-size="13.5" text-anchor="middle" fill="#4A3B2C">干活 · 围巾飘起 + 小爪忙碌</text>

  <!-- ===== 出错 error ===== -->
  <g transform="translate(670 252)">
    <ellipse cx="0" cy="58" rx="58" ry="11" fill="#3B2C1E" opacity="0.08"/>
    <circle cx="0" cy="0" r="80" fill="#F2665E" opacity="0.16"/>
    <g transform="rotate(-4)">
      <!-- 耳朵耷拉 -->
      <ellipse cx="-38" cy="-40" rx="16" ry="11" fill="#F6E4CB" stroke="#E5C3C0" stroke-width="1.4" transform="rotate(28 -38 -40)"/>
      <ellipse cx="38" cy="-40" rx="16" ry="11" fill="#F6E4CB" stroke="#E5C3C0" stroke-width="1.4" transform="rotate(-28 38 -40)"/>
      <ellipse cx="0" cy="2" rx="54" ry="50" fill="url(#furC)" stroke="#E5C3C0" stroke-width="1.6"/>
      <path d="M-46 22 q 46 18 92 0 q -8 14 -46 16 q -38 -2 -46 -16 z" fill="#F2665E" opacity="0.92"/>
      <path d="M40 30 q 24 18 16 44 q -2 -18 -14 -26 q 6 16 -2 30 q -4 -22 -18 -28 z" fill="#F2665E" opacity="0.9"/>
      <path d="M-26 -14 l 14 14 M-12 -14 l -14 14" fill="none" stroke="#3B2C1E" stroke-width="4" stroke-linecap="round"/>
      <path d="M10 -14 l 14 14 M24 -14 l -14 14" fill="none" stroke="#3B2C1E" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="0" cy="2" rx="5.5" ry="4" fill="#C98A83"/>
      <path d="M-8 14 q 8 -7 16 0" fill="none" stroke="#3B2C1E" stroke-width="2.8" stroke-linecap="round"/>
      <ellipse cx="-30" cy="44" rx="12" ry="8" fill="#F6E4CB" stroke="#E5C3C0" stroke-width="1.3"/>
      <ellipse cx="30" cy="44" rx="12" ry="8" fill="#F6E4CB" stroke="#E5C3C0" stroke-width="1.3"/>
    </g>
    <g stroke="#F2665E" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M-66 -70 l -10 -12"/><path d="M66 -70 l 10 -12"/>
    </g>
  </g>
  <text x="670" y="352" font-size="13.5" text-anchor="middle" fill="#4A3B2C">出错 · 耳朵耷拉 + 围巾垂下来 + 撇嘴</text>
</svg>
