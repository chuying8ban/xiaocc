<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<title>小cc · 设置</title>
<style>
__XIAOCC_STYLE__
/* —— 设置页在共用皮肤上的一点增量（三选一那一列） —— */
.choice{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.choice:last-of-type{border-bottom:0}
.choice .mark{width:15px;height:15px;flex:0 0 auto;margin-top:2px;border:1px solid var(--line2);border-radius:50%}
.choice.on .mark{border-color:var(--cyan);box-shadow:inset 0 0 0 4px var(--cyan)}
html[data-theme="paper"] .choice.on .mark{border-color:var(--ink);box-shadow:inset 0 0 0 4px var(--ink)}
.choice .txt{flex:1 1 auto;min-width:0}
.choice .txt b{font-weight:500;display:block}
.choice .txt small{display:block;color:var(--faint);font-size:10.5px;margin-top:2px;line-height:1.5}
.choice .now{flex:0 0 auto;font:400 10px/1 var(--mono);color:var(--cyan);padding-top:3px}
html[data-theme="paper"] .choice .now{color:var(--ink2)}
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <span class="dot" id="dot"></span>
    <h1>小cc · 设置</h1>
    <span class="sub" id="where"></span>
    <span class="spacer"></span>
    <button class="tool" id="btn-back">← 回面板</button>
    <button class="tool" id="btn-theme">皮肤</button>
    <button class="tool" id="btn-close">关闭</button>
  </div>

  <section>
    <div class="label">单击小cc时显示 <span class="tag" id="file"></span></div>
    <div id="choices"></div>
    <p class="note">双击小cc 一律是打开这个面板；右键出菜单。这一项只管单击那一下。</p>
  </section>

  <section>
    <div class="label">数据来源 <span class="tag" id="src-tag"></span></div>
    <p class="note" id="source"></p>
    <p class="note" id="problems"></p>
  </section>

  <footer>
    <span id="foot-left">改动立刻生效（桌宠每 5 秒重读一次）</span><span class="spacer"></span>
    <span id="foot-right"></span>
  </footer>
</div>

<script>
const DATA = __XIAOCC_PAYLOAD__;

const CHOICES = [
  ["badge",   "额度",     "按采集到的余额贴一条 8 秒的额度条；没有可自动获取的就如实说"],
  ["caption", "状态文案", "贴当前状态那句话（和平时一样，只是单击也会显示）"],
  ["none",    "不显示",   "单击什么都不做，只用双击/右键"]
];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function post(action, extra){
  const msg = Object.assign({action:action}, extra||{});
  const h = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.xiaocc);
  if(h){ h.postMessage(msg); }
  else { document.getElementById('foot-left').textContent = '浏览器里打开：' + action + ' 需要小cc 的窗口宿主'; }
  return msg;
}

function render(){
  const current = DATA.click_action || "badge";
  document.getElementById('choices').innerHTML = CHOICES.map(([key, name, hint]) =>
    '<div class="choice' + (key===current ? ' on' : '') + '" data-key="' + key + '">'
    + '<span class="mark"></span><span class="txt"><b>' + esc(name) + '</b><small>' + esc(hint) + '</small></span>'
    + (key===current ? '<span class="now">当前</span>' : '') + '</div>').join('');
  document.getElementById('where').textContent = '单击 = ' + (CHOICES.find(c => c[0]===current)||[,current])[1];
  document.getElementById('file').textContent = DATA.settings_path || 'settings.json';
  document.getElementById('src-tag').textContent = DATA.quota_meta && DATA.quota_meta.exists ? '已采集' : '未采集';
  document.getElementById('source').textContent = DATA.source_line || '';
  const p = (DATA.problems || []);
  document.getElementById('problems').textContent = p.length ? ('设置文件有问题：' + p.join('；')) : '';
  document.getElementById('foot-right').textContent = 'schema ' + (DATA.schema||1);
  if(DATA.theme){ document.documentElement.dataset.theme = DATA.theme; }
}

document.getElementById('choices').addEventListener('click', ev => {
  const row = ev.target.closest('.choice');
  if(!row) return;
  post('save', {click_action: row.dataset.key});
});
document.getElementById('btn-back').addEventListener('click', () => post('page', {value:'panel'}));
document.getElementById('btn-close').addEventListener('click', () => post('close'));
document.getElementById('btn-theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'night' ? 'paper' : 'night';
  document.documentElement.dataset.theme = next;
  post('theme', {value: next});
});
render();
</script>
</body>
</html>
